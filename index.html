<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Todo list</title>
        <link href="./css/main.css" rel="stylesheet">
	    <link href="./css/bootstrap.min.css" rel="stylesheet">
        <link href="./css/jquery-confirm.css" rel="stylesheet">
    </head>
    <body class="bg-dark">
    <div class="container">
    	<h2 class="text-center text-white">Todo List App</h2>
            <hr class="bg-light">
        	<div class="form-group">
                <div class="row">
                    
                    <div class="col-6">
                        <input type="text" class="form-control" id="title_text" placeholder="Enter Task Title Here ">
                    </div>
                    <div class="col-6 form-group">
                        <input  class="btn bg-white form-control-sm" id="tag_text" value="" placeholder="Tag (Optional)" />
                        <select id="priority_id" class="btn form-control-sm  bg-light">
                            <option value=""  selected>Select Priority</option>
                            <option value="3" >High - ⏫</option>
                            <option value="2" >Med - ➖</option>
                            <option value="1" >Low - ⏬</option>
                        </select>
                        <select id="status_id" class="btn form-control-sm bg-light">
                            <option value="1">Complete - ✔️</option>
                            <option value="2">InProgress - 🚀</option>
                            <option value="3" selected>Incomplete - ⌛</option>
                            <option value="4">Hold - 🛑</option>
                        </select>
                    </div>

                    <hr>
                    
                    <div class="col-6">
                        <textarea  class="form-control" style="min-width: 100%" id="description_text" placeholder="Enter Task More Details Here (Optional) "></textarea>
                    </div>
                    <div class="col-6 form-group">
                        <input id="start_date" class="btn btn-sm bg-light form-control-sm" type="text" placeholder="Start Date (Optional)" onclick="(this.type='datetime-local');this.showPicker()"/>
                        <input id="end_date" class="btn btn-sm bg-light form-control-sm" type="text" placeholder="End Date (Optional)" onclick="(this.type='datetime-local');this.showPicker()"/>
                    </div>

                </div>
        	</div>
            <hr class="bg-info">
            <div class="row mt-2">
                <div class="col-12">
                    <button onclick="add_item_list()" class="btn btn-primary mt-1">➕ Add To List</button>
                    <button onclick="clear_full_list()" class="btn btn-danger mt-1">⛔ Clear Todo List</button>
                </div>
            </div>
        <hr class="bg-danger">
        <h3 class="text-warning mt-2">Todo List</h3>
        <hr class="bg-warning">
        <ul id="todoList" class="container">
        </ul>
    </div>
    <script src = "./js/jquery-1.10.2.js"></script>
    <script src = "./js/jquery-ui.js"></script>
    <script src = "./js/jquery-confirm.js"></script>
    <script type="text/javascript" src="./js/new_main.js"></script>
    </body>
</html>
